[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "crochet-agent"
version = "0.1.0"
description = "A crochet pattern creation agent using UK terminology"
requires-python = ">=3.10"
dependencies = ["flask==3.0.3"]

[project.scripts]
crochet-agent = "crochet_agent.agent:main"
crochet-agent-web = "crochet_agent.web_app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
